services:
  orders-db:
    image: postgres:16
    container_name: orders-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ordersdb
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orderspass
    volumes:
      - orders-db-data:/var/lib/postgresql/data
    networks: [orders-network]
  orders-proxy:
    image: nginx:1.27-alpine
    container_name: orders-proxy
    restart: unless-stopped
    ports: ["8080:80"]
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks: [orders-network]
networks:
  orders-network:
    name: orders-network
volumes:
  orders-db-data:
    name: orders-db-data
